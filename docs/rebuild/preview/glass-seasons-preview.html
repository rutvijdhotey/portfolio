<h2 class="sr-only">Preview of the engineering hero in dark and light themes: glass navigation, a season cycle of none, rain, snow and sun, a liquid lake under the About me button, and a vapor transition on the role title.</h2>
<style>
.pv{display:grid;gap:14px;padding:.5rem 0}
.pv-ctl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-secondary)}
.pv-ctl button.on{background:var(--surface-1);border-color:var(--border-stronger)}
.f{position:relative;height:300px;border-radius:12px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:ui-sans-serif,system-ui,sans-serif;isolation:isolate}
.f[data-t=dark]{--bg:#0a0a0a;--tx:#fafafa;--mu:#8f8f94;--bd:rgb(255 255 255/.12);--nav:rgb(30 30 32/.78);--card:#19191b;--act:rgb(255 255 255/.1);--gbg:rgb(255 255 255/.1);--gbd:rgb(255 255 255/.15);--gsh:0 10px 40px -10px rgb(0 0 0/.7),inset 0 1px 0 rgb(255 255 255/.2),inset 0 -1px 0 rgb(255 255 255/.05);--inv:#fafafa;--ivt:#0a0a0a}
.f[data-t=light]{--bg:#fbfbfa;--tx:#121212;--mu:#6c6c70;--bd:rgb(0 0 0/.12);--nav:rgb(255 255 255/.82);--card:#f1f1ef;--act:rgb(235 235 235/.8);--gbg:rgb(255 255 255/.35);--gbd:rgb(255 255 255/.5);--gsh:0 10px 40px -10px rgb(0 0 0/.25),inset 0 1px 0 rgb(255 255 255/.7),inset 0 -1px 0 rgb(255 255 255/.15);--inv:#121212;--ivt:#fafafa}
.f canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.bar{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3}
.b{border-radius:999px;border:1px solid var(--bd);background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.f.glass .b{background:var(--gbg);border-color:var(--gbd);box-shadow:var(--gsh);backdrop-filter:blur(40px) saturate(2);-webkit-backdrop-filter:blur(40px) saturate(2)}
.nv{display:flex;gap:2px;padding:4px}
.ic{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--mu)}
.ic.on{color:var(--tx);background:var(--act)}
.orb{width:50px;height:50px;display:grid;place-items:center;color:var(--tx)}
.cta{height:50px;display:flex;align-items:center;gap:9px;padding:0 18px 0 6px;border-radius:999px;background:var(--inv);color:var(--ivt);font-size:14px;font-weight:500}
.av{width:38px;height:38px;border-radius:999px;background:#d98b5a;color:#141416;display:grid;place-items:center;font:12px ui-monospace,monospace}
.hero{position:absolute;left:26px;top:96px;display:flex;flex-direction:column;gap:18px;z-index:2}
.ttl{display:grid;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.05;width:230px;min-height:72px}
.ttl>span{grid-area:1/1}
.ttl i{font-style:normal;display:inline-block}
.ttl .w{display:inline-block;white-space:nowrap}
.vin{animation:vin 1s cubic-bezier(.22,1,.36,1) both}
.vout{animation:vout .9s cubic-bezier(.55,0,.75,.4) both}
@keyframes vin{0%{opacity:0;filter:blur(12px);transform:translate(var(--vx),.35em) scale(1.35)}60%{opacity:.85}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes vout{0%{opacity:1;filter:blur(0);transform:none}100%{opacity:0;filter:blur(14px);transform:translate(var(--dx),var(--dy)) scale(1.2)}}
.btns{display:flex;gap:10px}
.pill{position:relative;overflow:hidden;height:42px;padding:0 20px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;display:inline-grid;place-items:center;cursor:pointer;user-select:none;touch-action:none}
.pill>.lbl{position:relative;z-index:1}
.liq{position:absolute;inset:0;background:var(--liq);color:var(--liq);transform:translateY(88%);transition:background-color 2.5s,color 2.5s,transform .25s ease-out}
.liq svg{position:absolute;top:-20px;left:0;width:200%;height:24px;animation:drift 7s linear infinite}
@keyframes drift{to{transform:translateX(-50%)}}
.pill.hold .liq{transform:translateY(0);transition:background-color 2.5s,color 2.5s,transform 1.4s linear}
.por{position:absolute;left:50%;top:36px;translate:-50% 0;width:190px;height:auto;color:var(--tx);z-index:1}
.tag{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;background:var(--bg);z-index:2}
@media (prefers-reduced-motion:reduce){.vin,.vout,.liq svg{animation:none}}
</style>
<div class="pv">
  <div class="pv-ctl">Nav style
    <button type="button" data-n="glass" class="on">Glass</button>
    <button type="button" data-n="flat">Current</button>
    <span style="margin-left:auto">Hold "About me" to fill it</span>
  </div>
  <div class="f glass" data-t="dark"></div>
  <div class="f glass" data-t="light"></div>
</div>
<template id="tpl">
  <canvas></canvas>
  <div class="bar">
    <div class="b nv">
      <span class="ic on"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg></span>
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></span>
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></span>
    </div>
    <span class="b orb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
    <span class="cta"><span class="av">RD</span>Get in touch</span>
  </div>
  <svg class="por" viewBox="0 12 200 220" aria-hidden="true">
    <g fill="currentColor" stroke="currentColor" stroke-width="9" stroke-linejoin="round"><path d="M14 232C16 196 48 180 86 176V146H114V176C152 180 184 196 186 232Z"/><circle cx="52" cy="104" r="10"/><circle cx="148" cy="104" r="10"/><path d="M52 98C52 58 74 40 100 40S148 58 148 98C148 140 126 168 100 168S52 140 52 98Z"/><path d="M54 86C50 64 56 46 70 36C82 27 94 24 106 23C122 20 138 22 146 32C153 42 151 56 149 66C149 74 148 80 146 86Z"/></g>
    <g fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M86 146V186L100 196L114 186V146Z"/><path d="M14 232C16 196 48 180 86 176L100 194L114 176C152 180 184 196 186 232Z"/><path d="M86 175L78 191L97 196ZM114 175L122 191L103 196Z"/><path d="M100 196V232" fill="none" stroke-width="2.2"/>
      <circle cx="52" cy="104" r="10"/><circle cx="148" cy="104" r="10"/>
      <path d="M52 98C52 58 74 40 100 40S148 58 148 98C148 140 126 168 100 168S52 140 52 98Z"/>
      <path d="M54 106C56 142 76 166 100 166S144 142 146 106C142 120 134 127 126 128C120 122 110 119 100 120C90 119 80 122 74 128C66 127 58 120 54 106Z" fill="#e2e2e2" stroke="none"/>
      <path d="M52 98C52 58 74 40 100 40S148 58 148 98C148 140 126 168 100 168S52 140 52 98Z" fill="none"/>
      <path d="M54 86C50 64 56 46 70 36C82 27 94 24 106 23C122 20 138 22 146 32C153 42 151 56 149 66C149 74 148 80 146 86C143 78 140 72 136 67C126 62 114 63 104 61C92 58 80 58 71 63C63 68 58 76 56 86Z" fill="#2b2b2b"/>
      <path d="M68 81C74 75 84 74 92 77M132 81C126 75 116 74 108 77" fill="none" stroke-width="4"/><path d="M82 131C90 142 110 142 118 131" fill="none" stroke-width="3.2"/>
      <circle cx="80" cy="96" r="12.5" fill="none"/><circle cx="120" cy="96" r="12.5" fill="none"/><path d="M92.5 95C96 92 104 92 107.5 95M67.5 94L53 98M132.5 94L147 98" fill="none"/>
    </g>
    <g fill="#111"><circle cx="80" cy="96" r="3.6"/><circle cx="120" cy="96" r="3.6"/></g>
  </svg>
  <div class="hero">
    <div class="ttl"></div>
    <div class="btns">
      <span class="pill" data-hold><span class="liq"><svg viewBox="0 0 240 24" preserveAspectRatio="none"><path d="M0 12C20 2 40 2 60 12s40 10 60 0 40-10 60 0 40 10 60 0v12H0Z" fill="currentColor"/></svg></span><span class="lbl">About me</span></span>
      <span class="pill"><span class="lbl">See my work ↗</span></span>
    </div>
  </div>
  <span class="tag"></span>
</template>
<script>
(function(){
var SEASONS=['none','rain','snow','sun'];
var LIQ={dark:{none:'#1d1d20',rain:'#202f3f',snow:'#2c3846',sun:'#18405f'},light:{none:'#ececea',rain:'#dff2fd',snow:'#e9f1f8',sun:'#b2dffa'}};
var ROLES=['Backend Engineer','Agentic AI Engineer','Systems Builder'];
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var frames=[].slice.call(document.querySelectorAll('.pv .f')).map(function(f){
  f.appendChild(document.getElementById('tpl').content.cloneNode(true));
  var c=f.querySelector('canvas'),x=c.getContext('2d');
  var drops=[],flakes=[];for(var i=0;i<90;i++){drops.push({x:Math.random(),y:Math.random(),l:8+Math.random()*10,s:.9+Math.random()*.6});flakes.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.2,s:.12+Math.random()*.18,p:Math.random()*6.3})}
  var hold=f.querySelector('[data-hold]');
  hold.addEventListener('pointerdown',function(){hold.classList.add('hold')});
  ['pointerup','pointerleave','pointercancel'].forEach(function(e){hold.addEventListener(e,function(){hold.classList.remove('hold')})});
  return {f:f,c:c,x:x,t:f.dataset.t,drops:drops,flakes:flakes,w:{none:1,rain:0,snow:0,sun:0},ttl:f.querySelector('.ttl'),tag:f.querySelector('.tag')};
});
function letters(text,cls){
  var layer=document.createElement('span');var n=0;
  text.split(' ').forEach(function(word,wi){
    if(wi){layer.appendChild(document.createTextNode(' '))}
    var w=document.createElement('span');w.className='w';
    word.split('').forEach(function(ch){var i=document.createElement('i');i.textContent=ch;i.className=cls;
      i.style.setProperty('--vx',((Math.random()-.5)*.5).toFixed(2)+'em');
      i.style.setProperty('--dx',(.15+Math.random()*.45).toFixed(2)+'em');
      i.style.setProperty('--dy',(-.5-Math.random()*.4).toFixed(2)+'em');
      i.style.animationDelay=(n*35+Math.random()*90|0)+'ms';n++;w.appendChild(i)});
    layer.appendChild(w)});
  return layer;
}
function setRole(fr,text,first){
  var old=fr.ttl.lastElementChild;
  if(old){[].forEach.call(old.querySelectorAll('i'),function(i,k){i.className='vout';i.style.animationDelay=(k*25+Math.random()*80|0)+'ms'});setTimeout(function(){old.remove()},1500)}
  fr.ttl.appendChild(letters(text,first||reduce?'':'vin'));
}
var si=0,ri=0;
function setSeason(){var s=SEASONS[si];frames.forEach(function(fr){fr.season=s;fr.f.style.setProperty('--liq',LIQ[fr.t][s]);fr.tag.textContent='Season: '+s})}
frames.forEach(function(fr){setRole(fr,ROLES[0],true)});setSeason();
setInterval(function(){si=(si+1)%SEASONS.length;setSeason()},3500);
setInterval(function(){ri=(ri+1)%ROLES.length;frames.forEach(function(fr){setRole(fr,ROLES[ri])})},5000);
function draw(){
  frames.forEach(function(fr){
    var c=fr.c,x=fr.x,dpr=Math.min(2,devicePixelRatio||1),W=c.clientWidth,H=c.clientHeight;
    if(c.width!==W*dpr){c.width=W*dpr;c.height=H*dpr}
    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
    SEASONS.forEach(function(s){fr.w[s]+=((fr.season===s?1:0)-fr.w[s])*.035});
    var dark=fr.t==='dark',w=fr.w;
    if(!dark&&(w.rain+w.snow)>.01){var g=x.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,'rgba(222,232,244,'+(.9*Math.max(w.rain,w.snow))+')');g.addColorStop(1,'rgba(222,232,244,0)');x.fillStyle=g;x.fillRect(0,0,W,H*.5)}
    if(w.sun>.01){var sx=W*.86,sy=-H*.2,r=H*1.1,gs=x.createRadialGradient(sx,sy,0,sx,sy,r);
      gs.addColorStop(0,dark?'rgba(255,214,160,'+(.5*w.sun)+')':'rgba(255,236,190,'+(.95*w.sun)+')');
      gs.addColorStop(.55,dark?'rgba(255,170,100,'+(.14*w.sun)+')':'rgba(255,200,130,'+(.3*w.sun)+')');gs.addColorStop(1,'rgba(255,200,130,0)');
      x.fillStyle=gs;x.fillRect(0,0,W,H)}
    if(w.rain>.01){x.strokeStyle=dark?'rgba(150,160,175,'+(.55*w.rain)+')':'rgba(120,128,140,'+(.45*w.rain)+')';x.lineWidth=1;x.beginPath();
      fr.drops.forEach(function(d){if(!reduce){d.y+=d.s*.012;if(d.y>1.05){d.y=-.05;d.x=Math.random()}}var px=d.x*W,py=d.y*H;x.moveTo(px,py);x.lineTo(px-2,py+d.l)});x.stroke()}
    if(w.snow>.01){x.fillStyle=dark?'rgba(240,244,250,'+(.8*w.snow)+')':'rgba(150,168,190,'+(.85*w.snow)+')';
      fr.flakes.forEach(function(k){if(!reduce){k.y+=k.s*.006;k.p+=.02;if(k.y>1.03){k.y=-.03;k.x=Math.random()}}x.beginPath();x.arc(k.x*W+Math.sin(k.p)*6,k.y*H,k.r,0,6.283);x.fill()})}
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
[].forEach.call(document.querySelectorAll('.pv-ctl button'),function(b){b.addEventListener('click',function(){
  [].forEach.call(document.querySelectorAll('.pv-ctl button'),function(o){o.classList.toggle('on',o===b)});
  frames.forEach(function(fr){fr.f.classList.toggle('glass',b.dataset.n==='glass')})})});
})();
</script>
