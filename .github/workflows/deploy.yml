name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # See .nvmrc — the test suite needs Node's native type stripping.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # main deploys straight to rutvijdhotey.com. Gate it on the same checks
      # CI runs, so a direct push to main cannot ship a red build.
      - name: Tests
        run: npm test
      - name: Types
        run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
